<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs><style>
.title{font: bold 30px Arial;fill:#0f172a}.head{font:bold 20px Arial;fill:#172554}.field{font:16px Arial;fill:#1f2937}.box{fill:#f4f7fb;stroke:#334155;stroke-width:3}.bar{fill:#dce8f5;stroke:#334155;stroke-width:2}.rel{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arr)}.note{font:17px Arial;fill:#334155}
</style><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker></defs>
<rect width="1400" height="900" fill="white"/><text x="700" y="55" text-anchor="middle" class="title">StockWise — Oracle Star Schema</text>
<g><rect class="box" x="60" y="130" width="340" height="205" rx="12"/><rect class="bar" x="60" y="130" width="340" height="45" rx="10"/><text class="head" x="78" y="160">DIM_PRODUCT</text><text class="field" x="78" y="205">PK product_key</text><text class="field" x="78" y="235">UK product_id, sku</text><text class="field" x="78" y="265">product_name, category</text><text class="field" x="78" y="295">unit_cost, reorder_level</text></g>
<g><rect class="box" x="530" y="110" width="340" height="205" rx="12"/><rect class="bar" x="530" y="110" width="340" height="45" rx="10"/><text class="head" x="548" y="140">DIM_DATE</text><text class="field" x="548" y="185">PK date_key (YYYYMMDD)</text><text class="field" x="548" y="215">full_date, calendar_year</text><text class="field" x="548" y="245">quarter, month, month_name</text><text class="field" x="548" y="275">day_of_month, weekday_name</text></g>
<g><rect class="box" x="1000" y="130" width="340" height="205" rx="12"/><rect class="bar" x="1000" y="130" width="340" height="45" rx="10"/><text class="head" x="1018" y="160">DIM_SUPPLIER</text><text class="field" x="1018" y="205">PK supplier_key</text><text class="field" x="1018" y="235">UK supplier_id</text><text class="field" x="1018" y="265">supplier_name, region</text><text class="field" x="1018" y="295">rating</text></g>
<g><rect class="box" x="60" y="515" width="370" height="245" rx="12"/><rect class="bar" x="60" y="515" width="370" height="45" rx="10"/><text class="head" x="78" y="545">FACT_INVENTORY</text><text class="field" x="78" y="590">PK inventory_id</text><text class="field" x="78" y="620">FK product_key, snapshot_date_key</text><text class="field" x="78" y="650">opening / received / issued qty</text><text class="field" x="78" y="680">reserved / available qty</text></g>
<g><rect class="box" x="515" y="515" width="370" height="245" rx="12"/><rect class="bar" x="515" y="515" width="370" height="45" rx="10"/><text class="head" x="533" y="545">FACT_STOCK_MOVEMENT</text><text class="field" x="533" y="590">PK movement_id</text><text class="field" x="533" y="620">FK product_key, movement_date_key</text><text class="field" x="533" y="650">movement_type (IN / OUT)</text><text class="field" x="533" y="680">quantity, reference</text></g>
<g><rect class="box" x="960" y="515" width="380" height="275" rx="12"/><rect class="bar" x="960" y="515" width="380" height="45" rx="10"/><text class="head" x="978" y="545">FACT_PURCHASE_ORDER</text><text class="field" x="978" y="590">PK order_id</text><text class="field" x="978" y="620">FK product_key, supplier_key</text><text class="field" x="978" y="650">FK order / expected / actual date keys</text><text class="field" x="978" y="680">quantity_ordered, unit_cost</text></g>
<path class="rel" d="M230 335 V440 H245 V515"/><path class="rel" d="M700 315 V390 H245 V515"/><path class="rel" d="M700 315 V515"/><path class="rel" d="M700 315 V425 H1150 V515"/><path class="rel" d="M1170 335 V515"/><path class="rel" d="M400 245 H470 V470 H700 V515"/><path class="rel" d="M400 245 H485 V490 H1150 V515"/>
<text class="note" x="700" y="850" text-anchor="middle">Dimensions describe products, suppliers and dates; fact tables store measurable inventory events.</text>
</svg>